name: moversec
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  geolocator: ^13.0.0
  permission_handler: ^11.3.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  shared_preferences: ^2.2.3
  share_plus: ^7.2.2
  pedometer: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/badges/
    - assets/mascot/mascot_skin0.png
    - assets/mascot/mascot_skin0_outfit_black_tee.png
    - assets/mascot/mascot_skin0_outfit_moverse_tee.png
    - assets/mascot/mascot_skin1.png
    - assets/mascot/mascot_skin1_outfit_black_tee.png
    - assets/mascot/mascot_skin1_outfit_moverse_tee.png
    - assets/mascot/mascot_skin2.png
    - assets/mascot/mascot_skin2_outfit_black_tee.png
    - assets/mascot/mascot_skin2_outfit_moverse_tee.png